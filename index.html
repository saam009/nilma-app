<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nilma Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at center, #020617, #000);
  color: white;
  overflow: hidden;
}

/* Balance */
.topbar {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 22px;
  color: #00ffff;
}

/* Machine Animation */
.machine {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: linear-gradient(145deg, #00ffff, #0044ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: black;
  animation: pulse 2s infinite;
  box-shadow: 0 0 20px #00ffff;
}

/* Pulse Effect */
@keyframes pulse {
  0% { box-shadow: 0 0 20px #00ffff; }
  50% { box-shadow: 0 0 50px #00ffff; }
  100% { box-shadow: 0 0 20px #00ffff; }
}

/* Floating Buttons */
.btn {
  position: absolute;
  padding: 12px 16px;
  border-radius: 12px;
  background: #0f172a;
  border: 1px solid #00ffff;
  color: #00ffff;
  font-size: 14px;
  transition: 0.2s;
}

.spin { top: 40%; left: 10%; }
.task { top: 40%; right: 10%; }
.daily { bottom: 15%; left: 50%; transform: translateX(-50%); }

/* Click effect */
.btn:active {
  transform: scale(0.85);
  box-shadow: 0 0 20px #00ffff;
}

/* Floating animation */
.spin, .task {
  animation: float 3s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}
</style>
</head>

<body>

<div class="topbar">
💰 Balance: <span id="balance">0</span>
</div>

<div class="machine" onclick="mine()">
⚡ MINE
</div>

<button class="btn spin" onclick="spin()">🎰 Spin</button>
<button class="btn task" onclick="task()">📋 Task</button>
<button class="btn daily" onclick="daily()">🎁 Daily</button>

<script>
let coins = 0;

function update() {
  document.getElementById("balance").innerText = coins;
}

function mine() {
  coins += 5;
  update();
  navigator.vibrate(50); // feedback
}

function spin() {
  let rewards = [10, 20, 50, 100];
  let win = rewards[Math.floor(Math.random() * rewards.length)];
  coins += win;
  alert("You won " + win);
  update();
}

function task() {
  window.open("https://instagram.com/");
}

function daily() {
  coins += 25;
  alert("Daily reward +25");
  update();
}
</script>

</body>
</html>
