<!DOCTYPE html>
<html>
<head>
  <title>Nilma Coin 3D</title>
  <style>
    body { margin:0; overflow:hidden; background:black; }
    #balance {
      position:absolute;
      top:20px;
      width:100%;
      text-align:center;
      color:#00ffff;
      font-family:Arial;
      z-index:10;
    }
  </style>
</head>

<body>

<div id="balance">Balance: 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
let balance = 0;
function updateBalance(){
  document.getElementById("balance").innerText = "Balance: " + balance;
}

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,2,6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// lights
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const neon1 = new THREE.PointLight(0x00ffff, 2);
neon1.position.set(2,2,5);
scene.add(neon1);

const neon2 = new THREE.PointLight(0xff00ff, 2);
neon2.position.set(-2,-2,5);
scene.add(neon2);

// loaders
const loader = new THREE.GLTFLoader();

let core, mech;

// load core
loader.load("core.glb", (gltf)=>{
  core = gltf.scene;
  core.scale.set(1.5,1.5,1.5);
  scene.add(core);
});

// load mech
loader.load("mech.glb", (gltf)=>{
  mech = gltf.scene;
  mech.scale.set(0.8,0.8,0.8);
  mech.position.set(3,0,0);
  scene.add(mech);
});

// animation
function animate(){
  requestAnimationFrame(animate);

  if(core){
    core.rotation.y += 0.01;
  }

  if(mech){
    mech.rotation.y += 0.02;

    // orbit around core
    let time = Date.now() * 0.001;
    mech.position.x = Math.cos(time) * 3;
    mech.position.z = Math.sin(time) * 3;
  }

  renderer.render(scene, camera);
}
animate();

// mining click
window.addEventListener("click", ()=>{
  balance += 5;
  updateBalance();
});

// resize
window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
