<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nilma Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at center, #020617, #000);
  color: white;
  overflow: hidden;
}

/* Balance */
.topbar {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 22px;
  color: #00ffff;
}

/* Machine */
.machine {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, #00ffff, #0033ff);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 20px #00ffff,
    0 0 60px #00ffff,
    inset 0 0 20px #000;
  animation: pulse 2s infinite;
  font-size: 30px;
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px #00ffff; }
  50% { box-shadow: 0 0 50px #00ffff; }
  100% { box-shadow: 0 0 20px #00ffff; }
}

/* Buttons */
.btn {
  position: absolute;
  padding: 14px 18px;
  border-radius: 14px;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(0,255,255,0.5);
  color: #00ffff;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 10px rgba(0,255,255,0.3);
  transition: all 0.3s ease;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #00ffff;
}

.spin { 
  top: 40%; 
  left: 10%; 
  animation: float 3s ease-in-out infinite;
}

.task { 
  top: 40%; 
  right: 10%; 
  animation: float 3s ease-in-out infinite 1s;
}

.daily { 
  bottom: 15%; 
  left: 50%; 
  transform: translateX(-50%);
  animation: float 3s ease-in-out infinite 2s;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

/* Wheel */
#wheelBox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#wheel {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 5px solid cyan;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 3s ease-out;
} body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(0,255,255,0.2), transparent);
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: blur(80px);
  z-index: -1;
}
</style>
</head>

<body>

<div class="topbar">
💰 Balance: <span id="balance">0</span>
</div>

<div class="machine" onclick="mine()">⚡</div>

<button class="btn spin" onclick="openWheel()">🎰 Spin</button>
<button class="btn task" onclick="task()">📋 Task</button>
<button class="btn daily" onclick="daily()">🎁 Daily</button>
<div id="wheelBox">

  <div style="
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 20px solid red;
    margin-bottom: 10px;
  "></div>

  <div id="wheel" style="
  width:200px;
  height:200px;
  border-radius:50%;
  border:5px solid cyan;
  position:relative;
  overflow:hidden;
">

  <div style="position:absolute; width:100%; height:100%; transform:rotate(0deg);">
    <div style="position:absolute; top:10%; left:45%;">10</div>
    <div style="position:absolute; top:30%; left:75%;">20</div>
    <div style="position:absolute; top:60%; left:75%;">50</div>
    <div style="position:absolute; top:80%; left:45%;">100</div>
    <div style="position:absolute; top:60%; left:10%;">200</div>
    <div style="position:absolute; top:30%; left:10%;">0</div>
  </div>

</div>
  <br>
  <button onclick="spinWheel()">SPIN</button>
</div>

<script>
// LOAD DATA
let coins = parseInt(localStorage.getItem("coins")) || 0;
let lastDaily = parseInt(localStorage.getItem("lastDaily")) || 0;
let lastSpin = parseInt(localStorage.getItem("lastSpin")) || 0;

function save() {
  localStorage.setItem("coins", coins);
}

function update() {
  document.getElementById("balance").innerText = coins;
}
let taskDone = false;

function openInsta() {
  window.open("https://instagram.com/");
  taskDone = true;
}

function claimTask() {
  if (!taskDone) {
    alert("Complete the task first!");
    return;
  }

  coins += 30;
  save();
  update();

  alert("Task reward +30");

  document.getElementById("taskBox").style.display = "none";
  taskDone = false;
}
update();

// MINE
function mine() {
  coins += 5;
  save();
  update();
}

// TASK
function task() {
  document.getElementById("taskBox").style.display = "block";
}
// DAILY (24h)
// DAILY
function daily() {
  let now = Date.now();

  if (now - lastDaily < 86400000) {
    alert("Come back tomorrow!");
    return;
  }

  coins += 50;
  lastDaily = now;
  localStorage.setItem("lastDaily", lastDaily);

  save();
  update();
}

// OPEN WHEEL
function openWheel() {
  document.getElementById("wheelBox").style.display = "flex";
}
function spinWheel() {
  let now = Date.now();

  if (now - lastSpin < 10000) {
    alert("Wait a few seconds!");
    return;
  }

  lastSpin = now;
  localStorage.setItem("lastSpin", lastSpin);

  let rewards = [0, 10, 20, 50, 100, 200];
  let index = Math.floor(Math.random() * rewards.length);
  let win = rewards[index];

  let wheel = document.getElementById("wheel");

  // RESET FIRST (important)
  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";

  setTimeout(() => {
    let segmentAngle = 360 / rewards.length;
    let rotation = (360 * 5) + (index * segmentAngle);

    wheel.style.transition = "transform 3s ease-out";
    wheel.style.transform = "rotate(" + rotation + "deg)";
  }, 50);

  setTimeout(() => {
    coins += win;
    save();
    update();

    alert("You won " + win + " coins");

    document.getElementById("wheelBox").style.display = "none";
  }, 3000);
}
</script>
<div id="taskBox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:white; text-align:center; padding-top:100px;">
  
  <h2>📋 Complete Task</h2>

  <p>Follow our Instagram</p>

  <button onclick="openInsta()">Open Instagram</button>

  <br><br>

  <button onclick="claimTask()">✅ Claim Reward</button>

</div>
</body>
</html>
