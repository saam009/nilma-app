<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nilma Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at center, #020617, #000);
  color: white;
  overflow: hidden;
}

/* Balance */
.topbar {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 22px;
  color: #00ffff;
}

/* Machine */
.machine {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: linear-gradient(145deg, #00ffff, #0044ff);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px #00ffff; }
  50% { box-shadow: 0 0 50px #00ffff; }
  100% { box-shadow: 0 0 20px #00ffff; }
}

/* Buttons */
.btn {
  position: absolute;
  padding: 12px;
  border-radius: 12px;
  background: #0f172a;
  border: 1px solid #00ffff;
  color: #00ffff;
}

.spin { top: 40%; left: 10%; }
.task { top: 40%; right: 10%; }
.daily { bottom: 15%; left: 50%; transform: translateX(-50%); }

/* Wheel popup */
#wheelBox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#wheel {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 5px solid cyan;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  transition: transform 3s ease-out;
}
</style>
</head>

<body>

<div class="topbar">
💰 Balance: <span id="balance">0</span>
</div>

<div class="machine" onclick="mine()">⚡</div>

<button class="btn spin" onclick="openWheel()">🎰 Spin</button>
<button class="btn task" onclick="task()">📋 Task</button>
<button class="btn daily" onclick="daily()">🎁 Daily</button>

<!-- Wheel -->
<div id="wheelBox">
  <div id="wheel">🎰</div>
  <br>
  <button onclick="spinWheel()">SPIN</button>
</div>

<script>
let coins = 0;

function update() {
  document.getElementById("balance").innerText = coins;
}

function mine() {
  coins += 5;
  update();
}

function task() {
  window.open("https://instagram.com/");
}

function daily() {
  coins += 25;
  update();
}

// Wheel
function openWheel() {
  document.getElementById("wheelBox").style.display = "flex";
}

function spinWheel() {
  let rewards = [10, 20, 50, 100, 200];
  let win = rewards[Math.floor(Math.random() * rewards.length)];

  let wheel = document.getElementById("wheel");

  let rotation = Math.floor(Math.random() * 360) + 720;
  wheel.style.transform = "rotate(" + rotation + "deg)";

  setTimeout(() => {
    coins += win;
    update();
    alert("You won " + win + " coins!");
    document.getElementById("wheelBox").style.display = "none";
  }, 3000);
}
</script>

</body>
</html>
