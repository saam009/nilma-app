<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nilma Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0a0f1f, #000);
  color: white;
  overflow: hidden;
}

/* BACKGROUND GLOW */
body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(0,255,255,0.15), transparent);
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: blur(100px);
  z-index: -1;
}

/* SCREEN SYSTEM */
.screen {
  display: none;
  animation: fade 0.3s ease;
}

.screen.active {
  display: block;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* TOP */
.topbar {
  padding: 20px;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.25);
  backdrop-filter: blur(25px);
  border-radius: 20px;
  padding: 18px;
  margin: 12px;
  box-shadow:
    0 0 30px rgba(0,255,255,0.1),
    inset 0 0 10px rgba(255,255,255,0.05);
}

.balance {
  font-size: 24px;
  color: #00ffff;
}

.stat {
  font-size: 14px;
  opacity: 0.8;
}

.bar {
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 50%;
  background: linear-gradient(90deg, #00ffff, #0044ff);
}

.xpFill {
  height: 100%;
  width: 10%;
  background: linear-gradient(90deg, #ff00ff, #00ffff);
}

/* CENTER */
.center {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}

/* MACHINE */
.machine {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, #00ffff, #0033ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;

  box-shadow:
    0 0 20px #00ffff,
    0 0 60px rgba(0,255,255,0.6),
    inset 0 0 20px rgba(255,255,255,0.2);

  animation: pulse 2s infinite;
  transition: all 0.15s ease;
}

.machine:active {
  transform: scale(0.88);
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px #00ffff; }
  50% { box-shadow: 0 0 60px #00ffff; }
  100% { box-shadow: 0 0 20px #00ffff; }
}

/* FLOAT COIN */
.coin {
  position: fixed;
  color: gold;
  font-weight: bold;
  animation: flyUp 0.8s forwards;
}

@keyframes flyUp {
  to {
    transform: translateY(-80px);
    opacity: 0;
  }
}

/* WHEEL */
#wheel {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 5px solid cyan;
  background: conic-gradient(
    #00ffff 0deg 60deg,
    #0044ff 60deg 120deg,
    #00ffff 120deg 180deg,
    #0044ff 180deg 240deg,
    #00ffff 240deg 300deg,
    #0044ff 300deg 360deg
  );
  transition: transform 3s ease-out;
  margin-top: 20px;
}

/* BUTTON */
.spinBtn {
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(90deg, #00ffff, #0044ff);
  color: black;
  font-weight: bold;
}

/* NAV */
.bottomNav {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 70px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(10,15,30,0.9);
  border-top: 1px solid rgba(0,255,255,0.2);
  backdrop-filter: blur(15px);
}

.bottomNav div {
  text-align: center;
  font-size: 12px;
  color: #00ffff;
  opacity: 0.8;
}

.bottomNav div:active {
  transform: scale(0.9);
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg,#00ffff,#0044ff);
  color: black;
  font-weight: bold;
}
  /* NEW CYBER BACKGROUND */
.cyberBg{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;

  background:
  repeating-linear-gradient(
    90deg,
    rgba(0,255,255,0.05) 0px,
    rgba(0,255,255,0.05) 2px,
    transparent 2px,
    transparent 80px
  );

  animation:bgMove 10s linear infinite;

  z-index:-2;
}

@keyframes bgMove{
  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(100px);
  }
}

/* WHEEL */
#wheel {
  width: 240px;
  height: 240px;
  border-radius: 50%;
  border: 5px solid cyan;
  position: relative;
  overflow: hidden;

  background: conic-gradient(
    #00ffff 0deg 60deg,
    #0044ff 60deg 120deg,
    #00ffff 120deg 180deg,
    #0044ff 180deg 240deg,
    #00ffff 240deg 300deg,
    #0044ff 300deg 360deg
  );

  transition: transform 3s ease-out;

  box-shadow:
    0 0 40px rgba(0,255,255,0.5),
    inset 0 0 20px rgba(255,255,255,0.2);
}

.wheelText{
  position:absolute;
  color:white;
  font-weight:bold;
  font-size:18px;
  text-shadow:0 0 10px black;
}

.wheelArrow{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:0;
  height:0;

  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:35px solid #00ffff;

  z-index:999;
}

/* wheel number positions */
.t1{ top:15px; left:100px; }
.t2{ top:55px; right:25px; }
.t3{ bottom:55px; right:25px; }
.t4{ bottom:15px; left:100px; }
.t5{ bottom:55px; left:25px; }
.t6{ top:55px; left:25px; }

/* SMALLER NAV ITEMS */
.bottomNav div{
  flex:1;
  font-size:11px;
}

/* BACK BUTTON */
.backBtn{
  margin:15px;
}

/* MACHINE LOGO */
.machine img{
  width:90px;
  height:90px;
  object-fit:contain;
}

</style>
</head>

<body onclick="unlockAudio()">
 <div class="cyberBg"></div> 

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
  <button class="backBtn"
onclick="showScreen('homeScreen')">
⬅ Back
</button>

  <div class="topbar">

    <div class="card">

      <div class="balance">
        💰 <span id="balance">0</span>
      </div>

      <br>

      <div class="stat">
        ⚡ Energy: <span id="energy">100</span>
      </div>

      <div class="bar">
        <div class="fill" id="energyBar"></div>
      </div>

      <br>

      <div class="stat">
        ⭐ Level: <span id="level">1</span>
      </div>

      <div class="bar">
        <div class="xpFill" id="xpBar"></div>
      </div>

    </div>

  </div>

  <div class="center">
  <div class="machine" onclick="mine(event)">
  <img src="logo.png" width="90">
</div>
</div>
  </div>

<!-- SPIN SCREEN -->
<div id="spinScreen" class="screen">
 <button class="backBtn"
onclick="showScreen('homeScreen')">
⬅ Back
</button> 

  <h2 style="text-align:center; margin-top:40px;">
    🎰 Spin Wheel
  </h2>

  <div style="
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:40px;
  ">


    <!-- WHEEL -->
    <div id="wheel">
    <div class="wheelArrow"></div>

  <div class="wheelText t1">10</div>
  <div class="wheelText t2">20</div>
  <div class="wheelText t3">50</div>
  <div class="wheelText t4">100</div>
  <div class="wheelText t5">200</div>
  <div class="wheelText t6">0</div>

</div>

    <!-- BUTTON -->
    <button class="spinBtn" onclick="spinWheel()">
      SPIN
    </button>

  </div>

</div>

<!-- TASK SCREEN -->
<div id="taskScreen" class="screen">
 <button class="backBtn"
onclick="showScreen('homeScreen')">
⬅ Back
</button> 

  <h2 style="text-align:center; margin-top:40px;">
    📋 Tasks
  </h2>

  <div style="text-align:center; margin-top:40px;">

    <p>Follow our Instagram</p>

    <button onclick="openInsta()">
      Open Instagram
    </button>

    <br><br>

    <button onclick="claimTask()">
      Claim Reward
    </button>

  </div>

</div>

<!-- DAILY SCREEN -->
<div id="dailyScreen" class="screen">
  <button class="backBtn"
onclick="showScreen('homeScreen')">
⬅ Back
</button>

  <h2 style="text-align:center; margin-top:40px;">
    🎁 Daily Reward
  </h2>

  <div style="text-align:center; margin-top:40px;">

    <button onclick="daily()">
      Claim Daily Reward
    </button>

  </div>

</div>
 <!-- LEADERBOARD SCREEN -->
<div id="leaderboardScreen" class="screen">
  <button class="backBtn"
onclick="showScreen('homeScreen')">
⬅ Back
</button>

  <h2 style="text-align:center; margin-top:40px;">
    🏆 Leaderboard
  </h2>

  <div class="card" style="margin-top:30px;">

    <p>🥇 Player1 — 5000</p>
    <p>🥈 Player2 — 3000</p>
    <p>🥉 Player3 — 1000</p>

  </div>

</div> 
<!-- SHOP SCREEN -->
<div id="shopScreen" class="screen">
  <button class="backBtn"
onclick="showScreen('homeScreen')">
⬅ Back
</button>

  <h2 style="text-align:center; margin-top:40px;">
    💎 Upgrades Shop
  </h2>

  <div style="text-align:center; margin-top:40px;">

    <button onclick="buyUpgrade()">
      Upgrade Mining (+1)
    </button>

  </div>

</div>
<!-- AUDIO -->
<audio id="spinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-slot-machine-spin-1930.mp3"></audio>

<audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>

<audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.wav"></audio>

<!-- NAV -->
<div class="bottomNav">

  <div onclick="showScreen('homeScreen')">
    ⚡ Mine
  </div>

  <div onclick="showScreen('spinScreen')">
    🎰 Spin
  </div>

  <div onclick="showScreen('taskScreen')">
    📋 Tasks
  </div>

  <div onclick="showScreen('dailyScreen')">
    🎁 Daily
  </div>
<div onclick="showScreen('shopScreen')">
  💎 Shop
</div>
  <div onclick="showScreen('leaderboardScreen')">
  🏆 Top
</div>
</div>
<!-- TOAST -->

<div id="toast" style="
position:fixed;
top:30px;
left:50%;
transform:translateX(-50%);
background:rgba(0,255,255,0.15);
border:1px solid #00ffff;
padding:14px 24px;
border-radius:15px;
backdrop-filter:blur(15px);
color:#00ffff;
font-weight:bold;
display:none;
z-index:99999;
box-shadow:0 0 20px rgba(0,255,255,0.4);
">
TEXT
</div>  

<script>

/* DATA */

let coins = parseInt(localStorage.getItem("coins")) || 0;
let energy = parseInt(localStorage.getItem("energy")) || 100;
let level = parseInt(localStorage.getItem("level")) || 1;
let xp = parseInt(localStorage.getItem("xp")) || 0;

let xpMax = parseInt(localStorage.getItem("xpMax")) || 100;

let lastDaily = parseInt(localStorage.getItem("lastDaily")) || 0;
let lastSpin = parseInt(localStorage.getItem("lastSpin")) || 0;

let maxEnergy = 100;
let taskDone = false;
let minePower = 5;
update();


/* SCREEN SYSTEM */

function showScreen(screenId) {

  document.querySelectorAll(".screen").forEach(screen => {
    screen.style.display = "none";
  });

  document.getElementById(screenId).style.display = "block";
}

/* UPDATE UI */

function update() {

  document.getElementById("balance").innerText = coins;
  document.getElementById("energy").innerText = energy;
  document.getElementById("level").innerText = level;

  let energyPercent = (energy / maxEnergy) * 100;
  document.getElementById("energyBar").style.width = energyPercent + "%";

  let xpPercent = (xp / xpMax) * 100;
  document.getElementById("xpBar").style.width = xpPercent + "%";
}

/* SAVE */

function save() {

  localStorage.setItem("coins", coins);
  localStorage.setItem("energy", energy);
  localStorage.setItem("level", level);
  localStorage.setItem("xp", xp);
  localStorage.setItem("xpMax", xpMax);
}

/* MINE */
function mine(event) {

  if (energy <= 0) {
    showToast("No energy!");
    return;
  }

  coins += minePower;
  xp += 10;
  energy -= 1;

  checkLevelUp();

  save();
  update();

  showCoin(event.clientX, event.clientY);

  document.getElementById("clickSound").play().catch(()=>{});
}

/* LEVEL */

function checkLevelUp() {

  if (xp >= xpMax) {

    xp -= xpMax;

    level += 1;

    xpMax = Math.floor(xpMax * 1.5);
showToast("LEVEL UP!");

    save();
    update();
  }
}

/* FLOAT COIN */

function showCoin(x, y) {

  let coin = document.createElement("div");

  coin.className = "coin";
  coin.innerText = "+5";

  coin.style.left = x + "px";
  coin.style.top = y + "px";

  document.body.appendChild(coin);

  setTimeout(() => {
    coin.remove();
  }, 800);
}

/* DAILY */

function daily() {

  let now = Date.now();

  if (now - lastDaily < 86400000) {

   showToast("Come back tomorrow!");
    return;
  }

  coins += 50;

  lastDaily = now;

  localStorage.setItem("lastDaily", lastDaily);

  save();
  update();

  showToast("+50 Coins");
}

/* TASK */

function openInsta() {

  window.open("https://instagram.com/");
  taskDone = true;
}

function claimTask() {

  if (!taskDone) {

   showToast("Complete task first!");
    return;
  }

  coins += 30;

  save();
  update();

  showToast("+30 Coins");

  taskDone = false;
}

/* SPIN */

function spinWheel() {

  let now = Date.now();

  if (now - lastSpin < 10000) {

    showToast("Wait a few seconds!");
    return;
  }

  lastSpin = now;

  localStorage.setItem("lastSpin", lastSpin);

  document.getElementById("spinSound").play().catch(()=>{});

  let rewards = [0,10,20,50,100,200];

  let index = Math.floor(Math.random() * rewards.length);

  let win = rewards[index];

  let wheel = document.getElementById("wheel");

  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";

  setTimeout(() => {

    let segmentAngle = 360 / rewards.length;

    let rotation = (360 * 5) + (index * segmentAngle);

    wheel.style.transition = "transform 3s ease-out";

    wheel.style.transform =
      "rotate(" + rotation + "deg)";

  }, 50);

  setTimeout(() => {

    document.getElementById("winSound").play().catch(()=>{});

    coins += win;

    save();
    update();

    showToast("You won " + win + " coins");

  }, 3000);
}

/* ENERGY REGEN */

setInterval(() => {

  if (energy < maxEnergy) {

    energy += 1;

    save();
    update();
  }

}, 3000);
  /* PASSIVE MINING */

setInterval(() => {

  coins += level;

  save();
  update();

}, 5000);
  /* TOAST */

function showToast(text){

  let toast = document.getElementById("toast");

  toast.innerText = text;

  toast.style.display = "block";

  setTimeout(()=>{
    toast.style.display = "none";
  },2000);
}
  /* SHOP */

function buyUpgrade(){

  if(coins < 100){

    showToast("Need 100 coins!");
    return;
  }

  coins -= 100;

  minePower += 1;

  save();
  update();

  showToast("Mining upgraded!");
}

/* AUDIO */

let audioUnlocked = false;

function unlockAudio() {

  if (audioUnlocked) return;

  const sounds = [
    "spinSound",
    "winSound",
    "clickSound"
  ];

  sounds.forEach(id => {

    let sound = document.getElementById(id);

    sound.muted = true;

    sound.play().then(() => {

      sound.pause();

      sound.currentTime = 0;

      sound.muted = false;

    }).catch(()=>{});
  });

  audioUnlocked = true;
}

</script>

</body>
</html>
