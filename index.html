<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nilma Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at center, #020617, #000);
  color: white;
  overflow: hidden;
}
.bottomNav {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 75px;
  background: rgba(10, 15, 30, 0.9);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid rgba(0,255,255,0.2);
  backdrop-filter: blur(15px);
}

.bottomNav div {
  color: #00ffff;
  font-size: 13px;
  text-align: center;
  opacity: 0.8;
}

.bottomNav div:active {
  transform: scale(0.9);
  opacity: 1;
}  

/* Balance */
.topbar {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 22px;
  color: #00ffff;
}

/* Machine */
.machine {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, #00ffff, #0033ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  box-shadow:
    0 0 30px #00ffff,
    0 0 80px #00ffff;
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px #00ffff; }
  50% { box-shadow: 0 0 50px #00ffff; }
  100% { box-shadow: 0 0 20px #00ffff; }
}

/* Buttons */
.btn {
  position: absolute;
  padding: 14px 18px;
  border-radius: 14px;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(0,255,255,0.5);
  color: #00ffff;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 10px rgba(0,255,255,0.3);
  transition: all 0.3s ease;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #00ffff;
}

@keyframes float {
  0% { transform: translateY(0px) scale(1); }
  50% { transform: translateY(-10px) scale(1.05); }
  100% { transform: translateY(0px) scale(1); }
}

/* Wheel */
#wheelBox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#wheel {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 6px solid cyan;
  position: relative;
  overflow: hidden;
  transition: transform 3s ease-out;

  background: conic-gradient(
    #00ffff 0deg 60deg,
    #0044ff 60deg 120deg,
    #00ffff 120deg 180deg,
    #0044ff 180deg 240deg,
    #00ffff 240deg 300deg,
    #0044ff 300deg 360deg
  );
}
 body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(0,255,255,0.2), transparent);
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: blur(80px);
  z-index: -1;
}
.coin {
  position: fixed;
  font-size: 18px;
  color: gold;
  font-weight: bold;
  pointer-events: none;
  animation: flyUp 0.8s ease-out forwards;
}

@keyframes flyUp {
  0% {
    transform: translateY(0);
    opacity: 1;
  }
  100% {
    transform: translateY(-80px);
    opacity: 0;
  }
}
</style>
</head>

<body onclick="unlockAudio()">

<div class="topbar">
💰 Balance: <span id="balance">0</span><br>
⚡ Energy: <span id="energy">100</span><br>
⭐ Level: <span id="level">1</span>
</div>
<div class="machine" onclick="mine(event)">⚡</div>

<audio id="spinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-slot-machine-spin-1930.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>
<audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.wav"></audio>  
<div id="wheelBox">

 <div style="
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-bottom: 25px solid #00ffff;
  margin-bottom: 15px;
"></div> 

  <div id="wheel" style="
  width:200px;
  height:200px;
  border-radius:50%;
  border:5px solid cyan;
  position:relative;
  overflow:hidden;
">

  <div style="position:absolute; top:10%; left:45%;">10</div>
<div style="position:absolute; top:30%; left:75%;">20</div>
<div style="position:absolute; top:60%; left:75%;">50</div>
<div style="position:absolute; top:80%; left:45%;">100</div>
<div style="position:absolute; top:60%; left:10%;">200</div>
<div style="position:absolute; top:30%; left:10%;">0</div>

</div>
  <br>
  <button onclick="spinWheel()">SPIN</button>
</div>

<script>
// LOAD DATA
let coins = parseInt(localStorage.getItem("coins")) || 0;
let lastDaily = parseInt(localStorage.getItem("lastDaily")) || 0;
let lastSpin = parseInt(localStorage.getItem("lastSpin")) || 0;
  let audioUnlocked = false;
  let energy = parseInt(localStorage.getItem("energy")) || 100;
let maxEnergy = 100;
  let level = parseInt(localStorage.getItem("level")) || 1;
let levelUpCost = parseInt(localStorage.getItem("levelUpCost")) || 100;
  let xp = parseInt(localStorage.getItem("xp")) || 0;
let xpMax = parseInt(localStorage.getItem("xpMax")) || 100;
function checkLevelUp() {
  if (xp >= xpMax) {
    xp = xp - xpMax;   // reduce XP after level up
    level += 1;        // increase level

    xpMax = Math.floor(xpMax * 1.5); // next level harder

    localStorage.setItem("level", level);
    localStorage.setItem("xp", xp);
    localStorage.setItem("xpMax", xpMax);

    alert("LEVEL UP! Now level " + level);

    update();
  }
}
function showCoin(x, y) {
  let coin = document.createElement("div");
  coin.className = "coin";
  coin.innerText = "+5";

  coin.style.left = x + "px";
  coin.style.top = y + "px";

  document.body.appendChild(coin);

  setTimeout(() => {
    coin.remove();
  }, 800);
}
function unlockAudio() {
  if (audioUnlocked) return;

  const sounds = ["spinSound", "winSound", "clickSound"];

  sounds.forEach(id => {
    let sound = document.getElementById(id);
    sound.muted = true;
    sound.play().then(() => {
      sound.pause();
      sound.currentTime = 0;
      sound.muted = false;
    }).catch(()=>{});
  });

  audioUnlocked = true;
}
document.addEventListener("click", () => {
let spin = document.getElementById("spinSound");
spin.currentTime = 0;
spin.play().catch(()=>{});
let winS = document.getElementById("winSound");
winS.currentTime = 0;
winS.play().catch(()=>{});
  document.getElementById("clickSound").play().catch(()=>{});
}, { once: true });
function save() {
  localStorage.setItem("coins", coins);
}

function update() {
  document.getElementById("balance").innerText = coins;
  document.getElementById("energy").innerText = energy;
  document.getElementById("level").innerText = level;

  document.getElementById("xpText").innerText = xp + " / " + xpMax;

  let percent = (xp / xpMax) * 100;
  document.getElementById("xpBar").style.width = percent + "%";
}
let taskDone = false;

function openInsta() {
  window.open("https://instagram.com/");
  taskDone = true;
}

function claimTask() {
  if (!taskDone) {
    alert("Complete the task first!");
    return;
  }

  coins += 30;
  save();
  update();

  alert("Task reward +30");

  document.getElementById("taskBox").style.display = "none";
  taskDone = false;
}
update();
function mine(event) {
  if (energy <= 0) {
    alert("No energy!");
    return;
  }
  
  coins += 5;
  xp += 10;
localStorage.setItem("xp", xp);
  energy -= 1;
checkLevelUp();
  save();
  localStorage.setItem("energy", energy);

  update();

let x = e.touches ? e.touches[0].clientX : e.clientX;
let y = e.touches ? e.touches[0].clientY : e.clientY; 
  showCoin(x, y);
}

// TASK
function task() {
  document.getElementById("taskBox").style.display = "block";
}
// DAILY (24h)
// DAILY
function daily() {
  let now = Date.now();

  if (now - lastDaily < 86400000) {
    alert("Come back tomorrow!");
    return;
  }

  coins += 50;
  lastDaily = now;
  localStorage.setItem("lastDaily", lastDaily);

  save();
  update();
}

// OPEN WHEEL
function openWheel() {
  document.getElementById("wheelBox").style.display = "flex";
}
function spinWheel() {
document.getElementById("spinSound").play().catch(()=>{});
  let now = Date.now();

  if (now - lastSpin < 10000) {
    alert("Wait a few seconds!");
    return;
  }

  lastSpin = now;
  localStorage.setItem("lastSpin", lastSpin);

  let rewards = [0, 10, 20, 50, 100, 200];
  let index = Math.floor(Math.random() * rewards.length);
  let win = rewards[index];

  let wheel = document.getElementById("wheel");

  // RESET FIRST (important)
  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";

  setTimeout(() => {
    let segmentAngle = 360 / rewards.length;
    let rotation = (360 * 5) + (index * segmentAngle);

    wheel.style.transition = "transform 3s ease-out";
    wheel.style.transform = "rotate(" + rotation + "deg)";
  }, 50);

  setTimeout(() => {
  document.getElementById("winSound").play().catch(()=>{});
    coins += win;
    save();
    update();

    alert("You won " + win + " coins");

    document.getElementById("wheelBox").style.display = "none";
  }, 3000);
}
  setInterval(() => {
  if (energy < maxEnergy) {
    energy += 1;
    localStorage.setItem("energy", energy);
    update();
  }
}, 3000);
  </script>
<div id="taskBox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:white; text-align:center; padding-top:100px;">
  
  <h2>📋 Complete Task</h2>

  <p>Follow our Instagram</p>

  <button onclick="openInsta()">Open Instagram</button>

  <br><br>

  <button onclick="claimTask()">✅ Claim Reward</button>

</div>
<div class="bottomNav">
  <div onclick="mine(event)">⚡ Mine</div>
  <div onclick="openWheel()">🎰 Spin</div>
  <div onclick="task()">📋 Tasks</div>
  <div onclick="daily()">🎁 Daily</div>
</div>
</body>
</html>
