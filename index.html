<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nilma Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0a0f1f, #000);
  color: white;
}

/* TOP PANEL */
.topbar {
  padding: 20px;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.2);
  backdrop-filter: blur(20px);
  border-radius: 18px;
  padding: 15px;
  margin: 10px;
  box-shadow: 0 0 20px rgba(0,255,255,0.1);
}

.balance {
  font-size: 24px;
  color: #00ffff;
}

.stat {
  font-size: 14px;
  opacity: 0.8;
}

/* ENERGY BAR */
.bar {
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 50%;
  background: linear-gradient(90deg, #00ffff, #0044ff);
  transition: width 0.3s;
}

/* XP BAR */
.xpFill {
  height: 100%;
  width: 10%;
  background: linear-gradient(90deg, #ff00ff, #00ffff);
}

/* CENTER BUTTON */
.center {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}

.machine {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, #00ffff, #0033ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  box-shadow:
    0 0 30px #00ffff,
    inset 0 0 20px rgba(255,255,255,0.2);
  transition: all 0.15s ease;
}

.machine:active {
  transform: scale(0.9);
  box-shadow: 0 0 15px #00ffff;
}

/* FLOAT COIN */
.coin {
  position: fixed;
  color: gold;
  animation: flyUp 0.8s forwards;
}

@keyframes flyUp {
  to {
    transform: translateY(-80px);
    opacity: 0;
  }
}

/* NAV */
.bottomNav {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 70px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(10,15,30,0.9);
  border-top: 1px solid rgba(0,255,255,0.2);
  backdrop-filter: blur(15px);
}

.bottomNav div {
  text-align: center;
  font-size: 12px;
  color: #00ffff;
  opacity: 0.7;
}

.bottomNav div:active {
  transform: scale(0.9);
  opacity: 1;
}
  #wheelBox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none; /* IMPORTANT */
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: rgba(0,0,0,0.9);
  z-index: 999;
}

/* WHEEL */
#wheel {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 5px solid cyan;
  background: conic-gradient(
    #00ffff 0deg 60deg,
    #0044ff 60deg 120deg,
    #00ffff 120deg 180deg,
    #0044ff 180deg 240deg,
    #00ffff 240deg 300deg,
    #0044ff 300deg 360deg
  );
  transition: transform 3s ease-out;
}

/* SPIN BUTTON */
.spinBtn {
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(90deg, #00ffff, #0044ff);
  color: black;
  font-weight: bold;
}
</style>

</head>
<body onclick="unlockAudio()">

<div class="topbar">

  <div class="card">
    <div class="balance">💰 <span id="balance">0</span></div>

    <div class="stat">⚡ Energy: <span id="energy">100</span></div>
    <div class="bar">
      <div class="fill" id="energyBar"></div>
    </div>

    <div class="stat">⭐ Level: <span id="level">1</span></div>
    <div class="bar">
      <div class="xpFill" id="xpBar"></div>
    </div>
  </div>

</div>

<div class="center">
  <div class="machine" onclick="mine(event)">⚡</div>
</div>

<audio id="spinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-slot-machine-spin-1930.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>
<audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.wav"></audio>  
  <div id="wheelBox">

  <!-- pointer -->
  <div style="
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 25px solid #00ffff;
    margin-bottom: 15px;
  "></div>

  <!-- wheel -->
  <div id="wheel"></div>

  <!-- button -->
  <button class="spinBtn" onclick="spinWheel()">SPIN</button>

</div>

  <div id="wheel" style="
  width:200px;
  height:200px;
  border-radius:50%;
  border:5px solid cyan;
  position:relative;
  overflow:hidden;
">

<script>
// LOAD DATA
let coins = parseInt(localStorage.getItem("coins")) || 0;
let lastDaily = parseInt(localStorage.getItem("lastDaily")) || 0;
let lastSpin = parseInt(localStorage.getItem("lastSpin")) || 0;
  let audioUnlocked = false;
  let energy = parseInt(localStorage.getItem("energy")) || 100;
let maxEnergy = 100;
  let level = parseInt(localStorage.getItem("level")) || 1;
let levelUpCost = parseInt(localStorage.getItem("levelUpCost")) || 100;
  let xp = parseInt(localStorage.getItem("xp")) || 0;
let xpMax = parseInt(localStorage.getItem("xpMax")) || 100;
function checkLevelUp() {
  if (xp >= xpMax) {
    xp = xp - xpMax;   // reduce XP after level up
    level += 1;        // increase level

    xpMax = Math.floor(xpMax * 1.5); // next level harder

    localStorage.setItem("level", level);
    localStorage.setItem("xp", xp);
    localStorage.setItem("xpMax", xpMax);

    alert("LEVEL UP! Now level " + level);

    update();
  }
}
function showCoin(x, y) {
  let coin = document.createElement("div");
  coin.className = "coin";
  coin.innerText = "+5";

  coin.style.left = x + "px";
  coin.style.top = y + "px";

  document.body.appendChild(coin);

  setTimeout(() => {
    coin.remove();
  }, 800);
}
function unlockAudio() {
  if (audioUnlocked) return;

  const sounds = ["spinSound", "winSound", "clickSound"];

  sounds.forEach(id => {
    let sound = document.getElementById(id);
    sound.muted = true;
    sound.play().then(() => {
      sound.pause();
      sound.currentTime = 0;
      sound.muted = false;
    }).catch(()=>{});
  });

  audioUnlocked = true;
}
document.addEventListener("click", () => {
let spin = document.getElementById("spinSound");
spin.currentTime = 0;
spin.play().catch(()=>{});
let winS = document.getElementById("winSound");
winS.currentTime = 0;
winS.play().catch(()=>{});
  document.getElementById("clickSound").play().catch(()=>{});
}, { once: true });
function save() {
  localStorage.setItem("coins", coins);
}

function update() {
  document.getElementById("balance").innerText = coins;
  document.getElementById("energy").innerText = energy;
  document.getElementById("level").innerText = level;

  // ENERGY BAR
  let energyPercent = (energy / maxEnergy) * 100;
  document.getElementById("energyBar").style.width = energyPercent + "%";

  // XP BAR
  let xpPercent = (xp / xpMax) * 100;
  document.getElementById("xpBar").style.width = xpPercent + "%";
}
let taskDone = false;

function openInsta() {
  window.open("https://instagram.com/");
  taskDone = true;
}

function claimTask() {
  if (!taskDone) {
    alert("Complete the task first!");
    return;
  }

  coins += 30;
  save();
  update();

  alert("Task reward +30");

  document.getElementById("taskBox").style.display = "none";
  taskDone = false;
}
update();
function mine(event) {
  if (energy <= 0) {
    alert("No energy!");
    return;
  }
  
  coins += 5;
  xp += 10;
localStorage.setItem("xp", xp);
  energy -= 1;
checkLevelUp();
  save();
  localStorage.setItem("energy", energy);

  update();
 let x = event.clientX;
let y = event.clientY;
  showCoin(x, y);
}

// TASK
function task() {
  document.getElementById("taskBox").style.display = "block";
}
// DAILY (24h)
// DAILY
function daily() {
  let now = Date.now();

  if (now - lastDaily < 86400000) {
    alert("Come back tomorrow!");
    return;
  }

  coins += 50;
  lastDaily = now;
  localStorage.setItem("lastDaily", lastDaily);

  save();
  update();
}

// OPEN WHEEL
function openWheel() {
  document.getElementById("wheelBox").style.display = "flex";
}
function spinWheel() {
document.getElementById("spinSound").play().catch(()=>{});
  let now = Date.now();

  if (now - lastSpin < 10000) {
    alert("Wait a few seconds!");
    return;
  }

  lastSpin = now;
  localStorage.setItem("lastSpin", lastSpin);

  let rewards = [0, 10, 20, 50, 100, 200];
  let index = Math.floor(Math.random() * rewards.length);
  let win = rewards[index];

  let wheel = document.getElementById("wheel");

  // RESET FIRST (important)
  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";

  setTimeout(() => {
    let segmentAngle = 360 / rewards.length;
    let rotation = (360 * 5) + (index * segmentAngle);

    wheel.style.transition = "transform 3s ease-out";
    wheel.style.transform = "rotate(" + rotation + "deg)";
  }, 50);

  setTimeout(() => {
  document.getElementById("winSound").play().catch(()=>{});
    coins += win;
    save();
    update();

    alert("You won " + win + " coins");

    document.getElementById("wheelBox").style.display = "none";
  }, 3000);
}
  setInterval(() => {
  if (energy < maxEnergy) {
    energy += 1;
    localStorage.setItem("energy", energy);
    update();
  }
}, 3000);
  </script>
<div id="taskBox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:white; text-align:center; padding-top:100px;">
  
  <h2>📋 Complete Task</h2>

  <p>Follow our Instagram</p>

  <button onclick="openInsta()">Open Instagram</button>

  <br><br>

  <button onclick="claimTask()">✅ Claim Reward</button>

</div>
<div class="bottomNav">
  <div onclick="mine(event)">⚡ Mine</div>
  <div onclick="openWheel()">🎰 Spin</div>
  <div onclick="task()">📋 Tasks</div>
  <div onclick="daily()">🎁 Daily</div>
</div>
</body>
</html>
